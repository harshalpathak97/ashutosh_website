name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to Hostinger
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avz --delete"
          SOURCE: "out/"
          REMOTE_HOST: "153.92.220.250"
          REMOTE_USER: "u588271509"
          TARGET: "/home/u588271509/domains/ashutoshpathak.com/public_html/"
          REMOTE_PORT: "65002"
          # One-time safety net: if a WordPress install is still in public_html, archive it before --delete removes it
          SCRIPT_BEFORE: |
            cd ~/domains/ashutoshpathak.com
            if [ -f public_html/wp-config.php ]; then
              mkdir -p ~/backups
              tar -czf ~/backups/public_html-wordpress-$(date +%Y%m%d-%H%M%S).tar.gz public_html
              ls -la ~/backups
            fi
